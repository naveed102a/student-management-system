<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎓 Student Management System</h1>
    <p>DBMS Mini Project</p>
    <p>Created by DS-03, 18, 48, 51</p>
  </header>

  <main>
    <!-- FORM SECTION -->
    <section class="form-section">
      <h2 id="form-title">Add New Student</h2>
      <form id="studentForm">
        <input type="hidden" id="studentId">

        <label>Name</label>
        <input type="text" id="name" placeholder="Student ka naam" required>

        <label>Roll No</label>
        <input type="text" id="roll_no" placeholder="e.g. CS-101" required>

        <label>Department</label>
        <input type="text" id="department" placeholder="e.g. Computer Science" required>

        <label>Semester</label>
        <input type="number" id="semester" placeholder="e.g. 3" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="student@example.com">

        <div class="form-buttons">
          <button type="submit" id="submitBtn">Add Student</button>
          <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
        </div>
      </form>
    </section>

    <!-- TABLE SECTION -->
    <section class="table-section">
      <h2>All Students</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>Department</th>
            <th>Semester</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <!-- JS yahan rows daalega -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
